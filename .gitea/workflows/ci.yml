name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install "homeassistant==2025.1.4" pytest pytest-asyncio ruff
      - name: Static checks
        run: |
          python -m compileall -q custom_components
          ruff check --select E9,F63,F7,F82 custom_components tests
          git diff --check
      - name: Tests
        run: pytest
